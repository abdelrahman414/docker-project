<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .notes-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .note-card {
            transition: transform 0.2s;
            border-left: 4px solid #667eea;
        }
        .note-card:hover {
            transform: translateY(-2px);
        }
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
        }
        .btn-danger {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            border: none;
        }
        .btn-sm {
            padding: 0.25rem 0.5rem;
        }
    </style>
</head>
<body>
    <div class="notes-container">
        <div class="card p-4 mb-4">
            <h1 class="text-center mb-4">📝 My Notes</h1>
            
            <form method="POST" action="/notes" class="mb-4">
                <div class="input-group">
                    <textarea name="content" class="form-control" placeholder="Write your note here..." 
                             rows="3" required style="resize: none;"></textarea>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add Note
                    </button>
                </div>
            </form>

            <div id="notes">
                {% for note in notes %}
                <div class="card note-card p-3 mb-3">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <p class="mb-1">{{ note.content }}</p>
                            <small class="text-muted">
                                <i class="fas fa-clock"></i> {{ note.created_at }}
                            </small>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-outline-primary btn-sm" onclick="editNote({{ note.id }}, '{{ note.content | replace("'", "\\'") | replace('"', '\\"') }}')">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-outline-danger btn-sm" onclick="deleteNote({{ note.id }})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
                {% else %}
                <div class="text-center text-muted py-4">
                    <i class="fas fa-sticky-note fa-3x mb-3"></i>
                    <p>No notes yet. Add your first note above!</p>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelector('form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const response = await fetch('/notes', {
                method: 'POST',
                body: formData
            });
            
            if (response.ok) {
                location.reload();
            }
        });

        async function deleteNote(noteId) {
            if (confirm('Are you sure you want to delete this note?')) {
                const response = await fetch(`/notes/${noteId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    location.reload();
                }
            }
        }

        function editNote(noteId, currentContent) {
            const noteContent = prompt('Edit your note:', currentContent);
            if (noteContent !== null && noteContent.trim() !== '') {
                fetch(`/notes/${noteId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ content: noteContent })
                })
                .then(response => {
                    if (response.ok) {
                        location.reload();
                    }
                });
            }
        }
    </script>
</body>
</html>
